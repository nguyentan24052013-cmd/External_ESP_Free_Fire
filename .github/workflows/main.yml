name: Build TIPA

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v3
      - name: Install Theos
        run: |
          THEOS="$GITHUB_WORKSPACE/theos"
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          git clone --recursive https://github.com/theos/theos.git $THEOS
          brew install ldid
      - name: Install iPhoneOS 16.5 SDK
        run: |
          THEOS="$GITHUB_WORKSPACE/theos"
          mkdir -p $THEOS/sdks
          wget -q https://github.com/theos/sdks/archive/refs/heads/master.zip -O /tmp/sdks.zip
          unzip -q /tmp/sdks.zip -d $THEOS/sdks
          mv $THEOS/sdks/sdks-master/iPhoneOS16.5.sdk $THEOS/sdks/
          rm -rf $THEOS/sdks/sdks-master
      - name: Build App
        run: |
          export THEOS="$GITHUB_WORKSPACE/theos"
          export THEOS_PACKAGE_SCHEME=rootless
          mkdir -p .theos/obj
          make clean
          # Dừng lại ngay khi app được ký xong (trước khi lỗi đóng gói)
          make do || true
          # Tìm file .app ở bất kỳ đâu trong project và copy về đây
          find . -name "*.app" -type d -exec cp -r {} .theos/obj/ \;
          echo "Đã cứu được App!"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tipa-file
          path: |
            .theos/obj/*
